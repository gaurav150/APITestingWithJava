services:

  wiremock:
    build:
#      context: ./tests
      dockerfile: Dockerfile
    image: my-wiremock:latest
    container_name: wiremock
    ports:
      - "8181:8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/mappings"]
      interval: 5s
      timeout: 3s
      retries: 10

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    container_name: api-tests
    depends_on:
      wiremock:
        condition: service_healthy   # now genuinely waits for WireMock to respond, not just start
    environment:
      # Container-to-container communication uses the SERVICE NAME as the
      # hostname (Docker's internal DNS), not localhost and not the host
      # port (8181) - the tests container reaches WireMock's internal
      # port 8080 directly, over the shared 'backend' network.
      WIREMOCK_BASE_URL: http://wiremock:8080
    networks:
      - backend

networks:
  backend:
    driver: bridge