# docker-compose.yml
#
# One WireMock container PER real external API, each proxying to a
# different base URL. Add a new service block + a new .env entry for
# every additional API you need to integrate.
#
# Usage:
#   docker compose up --build
#   docker compose down

services:

  products-service:
    build: .
    image: my-wiremock:latest
    container_name: products-service
    ports:
      - "8181:8080"
    environment:
      - REVERSE_PROXY_ADDRESS=${PRODUCTS_TARGET_URL}
      - LOCAL_RESPONSE_TEMPLATE=true
    command: ["--proxy-all", "${PRODUCTS_TARGET_URL}", "--global-response-templating", "--verbose"]
    networks:
      - backend

  posts-service:
    build: .
    image: my-wiremock:latest
    container_name: posts-service
    ports:
      - "8182:8080"
    environment:
      - REVERSE_PROXY_ADDRESS=${POSTS_TARGET_URL}
      - LOCAL_RESPONSE_TEMPLATE=true
    command: ["--proxy-all", "${POSTS_TARGET_URL}", "--global-response-templating", "--verbose"]
    networks:
      - backend

  # Add more services here as you integrate more APIs, e.g.:
  # users-service:
  #   build: .
  #   image: my-wiremock:latest
  #   container_name: users-service
  #   ports:
  #     - "8183:8080"
  #   environment:
  #     - REVERSE_PROXY_ADDRESS=${USERS_TARGET_URL}
  #   command: ["--proxy-all", "${USERS_TARGET_URL}", "--global-response-templating"]
  #   networks:
  #     - backend

networks:
  backend:
    driver: bridge